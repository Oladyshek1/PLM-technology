# Render Blueprint: создаёт PostgreSQL + API + статический фронт
# из одного репозитория.
#
# Использование:
#   1. Залейте репозиторий на GitHub.
#   2. Render → New + → Blueprint → выберите репозиторий.
#   3. Render прочитает этот файл и создаст три сервиса.
#
# Пароль администратора задайте в панели Render (Environment) уже после
# создания — здесь он намеренно не прописан.

databases:
  - name: plm-booking-db
    databaseName: booking
    user: booking_user
    plan: free
    region: frankfurt

services:
  # API (FastAPI + uvicorn)
  - type: web
    name: plm-booking
    runtime: python
    plan: free
    region: frankfurt
    rootDir: docs/bd
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /version
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: plm-booking-db
          property: connectionString
      - key: ADMIN_PASSWORD
        sync: false        # значение задаётся вручную в панели Render
      - key: PYTHON_VERSION
        value: "3.11.9"

  # Статический фронт (index.html + admin.html + src/)
  - type: web
    name: plm-booking-frontend
    runtime: static
    region: frankfurt
    rootDir: docs/frontend
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /
        destination: /index.html
