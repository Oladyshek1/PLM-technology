name: AI Audit

on:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    container: python:3.11-slim
    steps:
      - uses: actions/checkout@v4
      
      - name: Install deps
        run: pip install --quiet openai requests
      
      - name: Run AI audit
        env:
          GROK_KEY: ${{ secrets.GROK }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, pathlib, requests
          from openai import OpenAI

          API_KEY = os.environ["GROK_KEY"]
          GITEA_URL = os.environ.get("GITEA_SERVER_URL", "http://localhost:3000")
          REPO_FULL = os.environ.get("GITHUB_REPOSITORY", "")
          REPO_DIR = pathlib.Path(".")

          # Собираем файлы
          files = []
          total = 0
          skip = {".git", "node_modules", "__pycache__", "venv", ".venv", "dist", ".gitea"}
          
          for path in sorted(REPO_DIR.rglob("*")):
              if not path.is_file(): continue
              rel = path.relative_to(REPO_DIR)
              if any(part in skip for part in rel.parts): continue
              if path.suffix in {".png", ".jpg", ".exe", ".zip", ".pdf", ".lock", ".yml"}: continue
              
              if total < 40000:
                  try:
                      text = path.read_text(errors="ignore")
                      files.append(f"--- Файл: {rel} ---\n{text}")
                      total += len(text)
                  except: pass

          code = "\n".join(files)

          # Запрос к Groq
          client = OpenAI(api_key=API_KEY, base_url="https://api.groq.com/openai/v1")
          resp = client.chat.completions.create(
              model="llama-3.3-70b-versatile",
              messages=[{"role": "user", "content": f"Ты старший разработчик. Проанализируй этот код. Найди ошибки, уязвимости и напиши список того, что нужно доделать. Формат: 1. Что есть в проекте, 2. Ошибки и проблемы, 3. Что нужно доделать.\n\nКОД:\n{code}"}]
          )
          report = resp.choices[0].message.content

          print("\n" + "="*60)
          print(report)
          print("="*60)

          # Сохраняем отчёт в файл
          with open("audit_report.md", "w") as f:
              f.write(report)
          print("\nОтчёт сохранён в audit_report.md")
          PY
      
      - name: Upload report
        uses: actions/upload-artifact@v4
        with:
          name: ai-audit-report
          path: audit_report.md